# docker-compose.yml — liegt auf dem VPS unter /opt/hausfest-via/docker-compose.yml
#
# Image kommt aus GHCR. Auf dem VPS: .env mit POSTGRES_PASSWORD.
# Reverse-Proxy (Caddy) zentral im /opt/ambardaellen/-Stack →
# hausfest-via.al-daellen.ch → hausfest-via-app:3000 via `proxy`-Netzwerk.

services:
  db:
    image: postgres:16-alpine
    container_name: hausfest-via-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hausfestvia}
      POSTGRES_USER: ${POSTGRES_USER:-hausfestvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hausfestvia} -d ${POSTGRES_DB:-hausfestvia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    image: ghcr.io/daellengarnier/hausfest-via:latest
    container_name: hausfest-via-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-hausfestvia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hausfestvia}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  db-data:
